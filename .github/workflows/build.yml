name: Build EXHALE

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which build to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - pypi
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  windows-installer:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build EXHALE wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build native launcher and installer
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python packaging/win_build.py --wheel $wheel

      - name: Test installer selections, upgrades, startup and removal
        run: ./packaging/windows/test-installer.ps1

      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhale-windows-test-logs
          path: |
            dist/windows-test-logs/**
            dist/windows-payload/runtime.log
          if-no-files-found: ignore

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exhale-windows
          path: dist/*-setup.exe

      - name: Create GitHub release if tag build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --generate-notes
          }

      - name: Upload Windows installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*-setup.exe --clobber

  macos-app:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            backends: both
          - runner: macos-15-intel
            architecture: x86_64
            backends: stardist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel for the setup app
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Build native macOS setup app and DMG
        run: |
          python packaging/macos/build.py --wheel dist/*.whl

      - name: Test packaged setup and backend imports
        env:
          EXHALE_SETUP_HOME: ${{ runner.temp }}/exhale-setup-check
        run: |
          mountpoint="$RUNNER_TEMP/exhale-dmg"
          mkdir -p "$mountpoint"
          hdiutil verify dist/exhale-macos-${{ matrix.architecture }}.dmg
          hdiutil attach dist/exhale-macos-${{ matrix.architecture }}.dmg -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          "$mountpoint/EXHALE.app/Contents/MacOS/EXHALE" --setup-check none
          "$mountpoint/EXHALE.app/Contents/MacOS/EXHALE" --setup-check ${{ matrix.backends }}

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exhale-macos-${{ matrix.architecture }}
          path: dist/exhale-macos-${{ matrix.architecture }}.dmg

      - name: Create GitHub release if tag build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --generate-notes

      - name: Upload macOS DMG to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/exhale-macos-${{ matrix.architecture }}.dmg --clobber

  pypi-publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    needs: []
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')

    environment:
      name: pypi
      url: https://pypi.org/p/exhale-xrf

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
