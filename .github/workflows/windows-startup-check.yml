name: Windows startup check

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  startup-check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backends: [none, stardist, cellpose, both]
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install EXHALE
        run: |
          python -m pip install --upgrade pip
          switch ("${{ matrix.backends }}") {
            "none" { pip install . }
            "stardist" { pip install ".[stardist]" }
            "cellpose" { pip install ".[cellpose,monai]" -r requirements-cellpose.txt }
            "both" { pip install ".[stardist,cellpose,monai]" -r requirements-cellpose.txt }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test application startup
        working-directory: ${{ runner.temp }}
        run: python -m exhale --startup-check
