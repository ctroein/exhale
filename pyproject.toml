[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name="exhale-xrf"
dynamic = ["version"]
authors=[
    {name="Carl Troein", email="carl.troein@mgeo.lu.se"},
    {name="Tom Delaire"},
    {name="Emanuel Larsson"},
    {name="Bryan Falcones"},
    {name="Karina Thånell"}
]
description="Exhale, Efficient X-ray Hub Aiding Lung Explorations"
license = "MIT"
license-files = [ "LICENSE" ]
classifiers = [ "Topic :: Scientific/Engineering :: Medical Science Apps." ]
readme="README.md"
requires-python = ">=3.11,<3.14"
# Upper bounds follow the dependency trial accepted on 2026-11-04.
# Calendar-versioned packages are bounded at the next month.
dependencies = [
    'packaging<27',
    'numpy<2.6',
    'scipy<1.19',
    'scikit-learn>=1.3,<1.10',
    'pandas<3.2',
    'h5py<3.17',
    'tifffile<2026.11',
    'imagecodecs<2026.11',
    'napari>=0.10,<0.11',
    'imageio<2.39',
    'pyqt6>=6.7,<6.13',
    'qtpy<2.5',
    'pyqtgraph>=0.13.7,<0.15',
]

[project.optional-dependencies]
stardist = [
    'csbdeep<0.9',
    "tensorflow==2.15.*; sys_platform == 'win32'",
    "tensorflow<2.21; sys_platform == 'linux'",
    "tensorflow<2.21; sys_platform == 'darwin'",
    'stardist<0.10',
]
cellpose = [
    'torch>=2.8,<2.16',
    'torchvision>=0.23,<0.30',
    'cellpose==4.2.1.1',
]
monai = [
    'torch>=2.8,<2.16',
    'monai>=1.6.1,<1.7',
]

smp = [
    'torch>=2.8,<2.16',
    'torchvision>=0.23,<0.30',
    'monai>=1.6.1,<1.7',
    'segmentation-models-pytorch>=0.6,<0.7',
]

[tool.setuptools_scm]

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.setuptools.packages.find]

[tool.setuptools.package-data]
"exhale" = [
  "resources/icons/*.svg",
  "resources/icons/*.png",
  "resources/icons/*.txt",
  "resources/linux/*.desktop",
  "resources/*.jpg",
  "resources/licenses/*",
  "resources/models/2D_versatile_fluo_copy/*",
  "resources/models/monai_unet/*",
]

[project.urls]
Homepage="https://github.com/ctroein/exhale"

[project.scripts]
exhale = "exhale.__main__:main"

[tool.dependency-trial.keep]
# Exceptions retained when testing otherwise unbounded runtime dependencies.
napari = "Keep the supported 0.10 API series; changes require review of the embedded viewer integration."
cellpose = "The CellposeDINO integration and trained weights target Cellpose 4.2.1.1."
